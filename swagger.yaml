schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        registration:
          type: string
          nullable: true
        role:
          type: string
          enum: [aluno, professor, coordenador, diretor, admin]
        city_id:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - email
        - role

    UserWithStudentDetails: # Schema for user endpoint returning student details
      allOf:
        - $ref: '#/schemas/User'
        - type: object
          properties:
            student:
              $ref: '#/schemas/StudentDetails'
              nullable: true

    Student:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        registration:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        class_id:
          type: string
          nullable: true
        grade_id:
          type: string
          nullable: true
        school_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name

    StudentDetails: # Schema for student endpoints returning full details
      allOf:
        - $ref: '#/schemas/Student'
        - type: object
          properties:
            user:
              $ref: '#/schemas/User'
              nullable: true
            school:
              $ref: '#/schemas/SchoolDetails'
              nullable: true
            class:
              $ref: '#/schemas/Class'
              nullable: true
            grade:
              $ref: '#/schemas/Grade'
              nullable: true

    School:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        address:
          type: string
        city_id:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - city_id

    SchoolDetails: # Simplified schema for nested school details
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    City:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - state

    CityDetails: # Simplified schema for nested city details
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - state

    Class:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        school_id:
          type: string
        grade_id:
          type: string
          nullable: true
      required:
        - id
        - name
        - school_id

    ClassDetails: # Schema for class endpoints returning full details
      allOf:
        - $ref: '#/schemas/Class'
        - type: object
          properties:
            school:
              $ref: '#/schemas/SchoolDetails'
              nullable: true
            grade:
              $ref: '#/schemas/Grade'
              nullable: true

    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        education_stage_id:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - name

    GradeDetails: # Schema for grade endpoints returning full details
      allOf:
        - $ref: '#/schemas/Grade'
        - type: object
          properties:
            education_stage:
              $ref: '#/schemas/EducationStage'
              nullable: true

    EducationStage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    Subject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    Skill:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        description:
          type: string
        subject_id:
          type: string
        grade_id:
          type: string
      required:
        - id
        - code
        - description

    Question:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        text:
          type: string
        formatted_text:
          type: string
        secondstatement:
          type: string
        images:
          type: array
          items:
            type: object
        subject_id:
          type: string
        title:
          type: string
        description:
          type: string
        command:
          type: string
        subtitle:
          type: string
        alternatives:
          type: array
          items:
            type: object
        skill:
          type: array
        grade_level:
          type: string
        difficulty_level:
          type: string
        correct_answer:
          type: string
        formatted_solution:
          type: string
        test_id:
          type: string
        question_type:
          type: string
        value:
          type: number
        topics:
          type: array
        version:
          type: integer
        created_by:
          type: string
        last_modified_by:
          type: string
        education_stage_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - text
        - question_type

    Test:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        subject:
          type: string
        grade_id:
          type: string
        intructions:
          type: string
        max_score:
          type: number
        time_limit:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        created_by:
          type: string
        municipalities:
          type: array
        schools:
          type: array
        course:
          type: string
        model:
          type: string
        subjects_info:
          type: array
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - type
        - course
        - model
        - created_by

    TestWithQuestions:
      allOf:
        - $ref: '#/schemas/Test'
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: '#/schemas/Question'

    UserQuickLinks:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        quickLinks:
          type: array
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - quickLinks

    Teacher:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        registration:
          type: string
        birth_date:
          type: string
          format: date
        tenant_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - registration

    Game:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        iframeHtml:
          type: string
        thumbnail:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        provider:
          type: string
        subject:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - url
        - title
        - iframeHtml
        - subject
        - provider
        - userId

    TestSession:
      type: object
      properties:
        id:
          type: string
        student_id:
          type: string
        test_id:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        time_limit_minutes:
          type: integer
          nullable: true
        status:
          type: string
        total_questions:
          type: integer
          nullable: true
        correct_answers:
          type: integer
          nullable: true
        score:
          type: number
          nullable: true
        grade:
          type: number
          nullable: true
        feedback:
          type: string
          nullable: true
        corrected_by:
          type: string
          nullable: true
        corrected_at:
          type: string
          format: date-time
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - student_id
        - test_id
        - status

    StudentAnswer:
      type: object
      properties:
        id:
          type: string
        student_id:
          type: string
        test_id:
          type: string
        question_id:
          type: string
        answer:
          type: string
        answered_at:
          type: string
          format: date-time
        is_correct:
          type: boolean
          nullable: true
        manual_score:
          type: number
          nullable: true
        feedback:
          type: string
          nullable: true
        corrected_by:
          type: string
          nullable: true
        corrected_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - student_id
        - test_id
        - question_id
        - answer

    EvaluationResult:
      type: object
      properties:
        id:
          type: string
        test_id:
          type: string
        student_id:
          type: string
        session_id:
          type: string
        correct_answers:
          type: integer
        total_questions:
          type: integer
        score_percentage:
          type: number
        grade:
          type: number
        proficiency:
          type: number
        classification:
          type: string
        calculated_at:
          type: string
          format: date-time
      required:
        - id
        - test_id
        - student_id
        - session_id
        - correct_answers
        - total_questions
        - score_percentage
        - grade
        - proficiency
        - classification

    DashboardSummary:
      type: object
      properties:
        students:
          type: integer
        schools:
          type: integer
        evaluations:
          type: integer
        games:
          type: integer
        users:
          type: integer
        questions:
          type: integer
        classes:
          type: integer
        teachers:
          type: integer
        active_students:
          type: integer
          nullable: true
        last_sync:
          type: string
          format: date-time

    DashboardTrend:
      type: object
      properties:
        current:
          type: number
        previous:
          type: number

    DashboardKpi:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
        trend:
          $ref: '#/schemas/DashboardTrend'
        active_this_week:
          type: integer
        created_this_month:
          type: integer
        pending_corrections:
          type: integer
        trend_percentage:
          type: number
