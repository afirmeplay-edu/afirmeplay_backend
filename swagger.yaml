        - label
        - value

    DashboardSecondaryCard:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: number
          nullable: true
        status:
          type: string
          nullable: true
      required:
        - id
        - label

    DashboardSchoolRankingEntry:
      type: object
      properties:
        position:
          type: integer
        school_id:
          type: string
        school_name:
          type: string
        municipality:
          type: string
          nullable: true
        average_score:
          type: number
        completion_rate:
          type: number
        total_students:
          type: integer
        total_evaluations:
          type: integer

    DashboardClassRankingEntry:
      type: object
      description: Entrada do ranking de turmas (turma, série, média, acerto, conclusão, alunos, avaliações)
      properties:
        position:
          type: integer
        class_id:
          type: string
        turma:
          type: string
        serie:
          type: string
        media:
          type: number
        acerto:
          type: integer
        acerto_percent:
          type: number
        conclusao:
          type: number
        alunos:
          type: integer
        avaliacoes:
          type: integer

    DashboardStudentRankingEntry:
      type: object
      properties:
        position:
          type: integer
        student_id:
          type: string
        name:
          type: string
        school_name:
          type: string
          nullable: true
        class_name:
          type: string
          nullable: true
        serie:
          type: string
          description: Série/ano do aluno (grade)
          nullable: true
        media:
          type: number
          description: Média das notas (0-10), 2 decimais
        completed_evaluations:
