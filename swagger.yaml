        subject:
          type: string
          nullable: true
        school:
          type: string
          nullable: true
        class_name:
          type: string
          nullable: true
        status:
          type: string
        progress_percentage:
          type: number
        total_students:
          type: integer
        completed_students:
          type: integer
        average_score:
          type: number
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true

    DashboardRecentStudent:
